<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News & Insights | NWSmart5.0 Knowledge Hub</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LHEP92H7P6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-LHEP92H7P6');
    </script>
</head>
<body>
    <header>
        <div class="nav-container">
            <h1>NWSmart5.0 <span>Knowledge Hub</span></h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="cybersecurity.html">Cybersecurity</a>
                <a href="safe-ai.html">Safe AI</a>
                <a href="digital.html">Digital Transformation</a>
                <a href="library.html">Knowledge Library</a>
                <a href="news.html">News</a>
            </nav>
        </div>
    </header>

    <section class="page-hero" style="background: linear-gradient(rgba(30, 58, 138, 0.85), rgba(15, 23, 42, 0.9)); padding: 140px 20px;">
        <h2>Live News & Insights</h2>
        <p>Real-time updates from industry and cybersecurity sources</p>
    </section>

    <div class="container">
        <div class="main-content" style="grid-column: 1 / -1;">
            
            <input type="text" id="news-search" placeholder="Search news (e.g. ransomware, AI, OT...)" 
                   style="width:100%; padding:16px 20px; margin:20px 0 25px; border-radius:50px; border:1px solid #cbd5e1; font-size:16px;">

            <div class="filter-buttons" style="margin-bottom:30px;">
                <button class="filter-btn active" data-category="all">All News</button>
                <button class="filter-btn" data-category="cyber">Cybersecurity</button>
                <button class="filter-btn" data-category="ai">Safe AI</button>
                <button class="filter-btn" data-category="digital">Digital Transformation</button>
            </div>

            <div id="news-grid" class="resource-grid"></div>
        </div>
    </div>

    <footer class="footer">
        <p><strong>NWSmart5.0 Knowledge Hub</strong> — CyberFocus Project<br>
        University of Salford • Greater Manchester</p>
    </footer>

    <script>
        let allNews = [];

        async function fetchLiveNews() {
            const container = document.getElementById('news-grid');
            container.innerHTML = `<p style="grid-column:1/-1; text-align:center; padding:60px 20px;">Loading live news...</p>`;

            try {
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent('https://industrialcyber.co/feed/')}`;
                const res = await fetch(proxyUrl);
                const text = await res.text();

                const parser = new DOMParser();
                const xml = parser.parseFromString(text, "text/xml");

                allNews = Array.from(xml.querySelectorAll("item")).map(item => {
                    const title = item.querySelector("title").textContent.trim();
                    // Simple keyword-based category assignment
                    let category = "cyber";
                    if (title.toLowerCase().includes("ai") || title.toLowerCase().includes("artificial")) category = "ai";
                    if (title.toLowerCase().includes("digital") || title.toLowerCase().includes("industry 5")) category = "digital";

                    return {
                        title: title,
                        link: item.querySelector("link").textContent.trim(),
                        excerpt: item.querySelector("description") ? 
                                item.querySelector("description").textContent.replace(/<[^>]+>/g, '').substring(0, 160) + "..." : "",
                        date: item.querySelector("pubDate") ? 
                              new Date(item.querySelector("pubDate").textContent).toLocaleDateString('en-GB') : "Recent",
                        category: category
                    };
                });

                renderNews(allNews);

            } catch (e) {
                console.error(e);
                container.innerHTML = `<p style="grid-column:1/-1; color:#f59e0b; text-align:center; padding:60px;">Unable to load live news.<br>Please refresh the page.</p>`;
            }
        }

        function renderNews(items) {
            const grid = document.getElementById('news-grid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; padding:40px;">No results found.</p>`;
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card news-card';
                card.innerHTML = `
                    <span class="news-date">${item.date}</span>
                    <h3><a href="${item.link}" target="_blank">${item.title}</a></h3>
                    <p>${item.excerpt}</p>
                    <a href="${item.link}" target="_blank" class="read-more">Read Full Article →</a>
                `;
                grid.appendChild(card);
            });
        }

        // Search
        document.getElementById('news-search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allNews.filter(item => 
                item.title.toLowerCase().includes(term) || item.excerpt.toLowerCase().includes(term)
            );
            renderNews(filtered);
        });

        // Filters - Now working!
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const category = btn.dataset.category;
                let filtered = allNews;

                if (category !== 'all') {
                    filtered = allNews.filter(item => item.category === category);
                }
                renderNews(filtered);
            });
        });

        window.addEventListener('load', fetchLiveNews);
    </script>
</body>
</html>
