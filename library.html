<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Library | NWSmart5.0</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LHEP92H7P6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-LHEP92H7P6');
    </script>
</head>
<body>
 <div id="navbar"></div>

    <section class="page-hero" style="min-height: 45vh; padding: 100px 20px;">
        <h2>Knowledge Library</h2>
        <p>Search and download practical infographics, guides and tools for manufacturing SMEs</p>
    </section>

    <div class="container">
        <div class="main-content">
            <input type="text" id="resource-search" 
                   placeholder="Search resources (e.g. ransomware, phishing, password)...">

            <div class="filter-buttons">
                <button class="filter-btn active" data-category="all">All Resources</button>
                <button class="filter-btn" data-category="infographic">Infographics & Guides</button>
                <button class="filter-btn" data-category="cyber">Cybersecurity</button>
                <button class="filter-btn" data-category="digital">Digital Transformation</button>
                <button class="filter-btn" data-category="ai">Safe AI</button>
            </div>

            <div class="resource-grid" id="resource-grid"></div>
        </div>

        <div class="sidebar">
            <h3>Important Links</h3>
            <ul>
                <li><a href="https://www.ncsc.gov.uk/" target="_blank">National Cyber Security Centre</a></li>
                <li><a href="https://www.ncsc.gov.uk/collection/cyber-action-toolkit" target="_blank">Cyber Action Toolkit</a></li>
            </ul>
        </div>
    </div>

    <footer class="footer">
        <p><strong>NWSmart5.0 Knowledge Hub</strong> — CyberFocus Project<br>
        University of Salford • Greater Manchester</p>
    </footer>

    <script>
        const resources = [
            // Infographics & Guides
            {title: "10 Steps to Cyber Security", category: "infographic", link: "infographics/2021-10-steps-to-cyber-security-infographic.pdf"},
            {title: "Ransomware - What You Need to Know", category: "infographic", link: "infographics/NCSC_Ransomware-what-you-need-to-know.pdf"},
            {title: "Phishing - Defending Your Organisation", category: "infographic", link: "infographics/Phishing-attacks-defending-your-organisation-infographic.pdf"},
            {title: "Phishing - Dealing with Suspicious Emails", category: "infographic", link: "infographics/Phishing-attacks-dealing-suspicious-emails-infographic.pdf"},
            {title: "Backing Up Your Data", category: "infographic", link: "infographics/Backing up your data (NCSC Infographic).pdf"},
            {title: "Supply Chain Cyber Security", category: "infographic", link: "infographics/Assess-supply-chain-cyber-security.pdf"},
            {title: "Protecting Devices from Viruses & Malware", category: "infographic", link: "infographics/Protecting-devices-from-viruses-and-malware-infographic.pdf"},
            {title: "Recovering Hacked Accounts", category: "infographic", link: "infographics/recovering-hacked-accounts-infographics.pdf"},
            {title: "Use 2SV to Protect Accounts", category: "infographic", link: "infographics/Use-2SV-to-protect-accounts-infographic.pdf"},
            {title: "Video Conferencing Security", category: "infographic", link: "infographics/Video_conferencing_infographic.pdf"},
            {title: "Password Policy", category: "infographic", link: "infographics/password_policy_infographic.pdf"},
            {title: "Reporting Cyber Incidents", category: "infographic", link: "infographics/NCSC_Reporting-incidents-infographic.pdf"},
            {title: "Cyber Exercise Creation", category: "infographic", link: "infographics/cyber_exercise_creation.pdf"},
            {title: "Moving from Physical to Digital", category: "infographic", link: "infographics/moving-physical-digital-infographic.pdf"},

            // PDFs from pdfs folder
            {title: "How to Secure Your Online Meetings", category: "infographic", link: "pdfs/How-to-secure-your-online-meetings.pdf"},
            {title: "Mitigating Malware and Ransomware Attacks", category: "infographic", link: "pdfs/Mitigating-malware-and-ransomware-attacks.pdf"},
            {title: "NCSC A5 Response and Recovery Guide", category: "infographic", link: "pdfs/NCSC_A5_Response_and_Recovery_Guide_v3.pdf"},
            {title: "NCSC A5 Small Business Guide", category: "infographic", link: "pdfs/NCSC_A5_Small_Business_Guide_v4_OCT20.pdf"},
            {title: "NCSC SBG Actions", category: "infographic", link: "pdfs/NCSC_SBG_Actions.pdf"},
            {title: "Securing Your Devices", category: "infographic", link: "pdfs/Securing-your-devices.pdf"},
            {title: "Choosing a Managed Service Provider", category: "infographic", link: "pdfs/choosing-a-managed-service-provider-msp.pdf"},
            {title: "Effective Steps to Cyber Exercise Creation", category: "infographic", link: "pdfs/effective-steps-to-cyber-exercise-creation.pdf"},
            {title: "Recovering a Hacked Account", category: "infographic", link: "pdfs/recovering-a-hacked-account.pdf"},
            {title: "Social Media - Protect What You Publish", category: "infographic", link: "pdfs/social-media-protect-what-you-publish.pdf"}
        ];

        function renderResources(filtered) {
            const grid = document.getElementById('resource-grid');
            grid.innerHTML = '';
           
            if (filtered.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #64748b; font-size: 1.1rem;">
                    No resources found.<br><small>Try a different search term.</small>
                </p>`;
                return;
            }

            filtered.forEach(r => {
                const card = document.createElement('div');
                card.className = 'resource-card';
                card.innerHTML = `
                    <h3>${r.title}</h3>
                    <p style="color:#64748b; font-size:14px; margin:8px 0;">PDF • GUIDE</p>
                    <a href="${r.link}" target="_blank" class="button-primary" style="margin-top:12px; width:100%; text-align:center; display:inline-block;">
                        Download PDF
                    </a>
                `;
                grid.appendChild(card);
            });
        }

        // Initial render
        renderResources(resources);

        // Search
        document.getElementById('resource-search').addEventListener('input', () => {
            const term = document.getElementById('resource-search').value.toLowerCase();
            const filtered = resources.filter(r => r.title.toLowerCase().includes(term));
            renderResources(filtered);
        });

        // Filters
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const category = btn.dataset.category;
                let filtered = resources;

                if (category !== 'all') {
                    filtered = resources.filter(r => r.category === category);
                }
                renderResources(filtered);
            });
        });
        fetch('navbar.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('navbar').innerHTML = data;

        const currentPage = window.location.pathname.split("/").pop();

        document.querySelectorAll('nav a').forEach(link => {

            const href = link.getAttribute('href');

            if (
                href === currentPage ||
                (currentPage === '' && href === 'index.html')
            ) {
                link.classList.add('active-nav');
            }

        });
    });
window.onscroll = function () {
    const btn = document.getElementById("backToTopBtn");

    if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
        btn.style.display = "flex";
    } else {
        btn.style.display = "none";
    }
};

function scrollToTop() {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}
    </script>
    <button id="backToTopBtn" onclick="scrollToTop()">
    ↑ Top
</button>
</body>
</html>
